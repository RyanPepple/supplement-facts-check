name: IndexNow
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/**']
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to deploy
        run: sleep 120
      - name: Submit sitemap URLs to IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          set -e
          URLS=$(curl -fsSL https://supplementfactscheck.org/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed -e 's#<loc>##' -e 's#</loc>##' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          BODY=$(python3 -c 'import json,sys;print(json.dumps({"host":"supplementfactscheck.org","key":"467a9ebda6d83eb33625c3b7a5774b4e","keyLocation":"https://supplementfactscheck.org/467a9ebda6d83eb33625c3b7a5774b4e.txt","urlList":json.loads(sys.argv[1])}))' "$URLS")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "IndexNow responded $CODE"
          case "$CODE" in 200|202) exit 0;; *) exit 1;; esac
